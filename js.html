<script>
// ==========================================
// CẤU HÌNH ĐƯỜNG LINK WEB APP CỦA BẠN TẠI ĐÂY
// ==========================================
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxX1-kVR9QsFVFYxoABnkgiOs0aHA0n3FassMUcMufHIwMn1RUJR34K0RVR-7iv4AMu/exec";

let currentSheet = 'tiengDucA1';
let allData = [];
let filteredData = [];
let currentPage = 1;
const rowsPerPage = 50;

// Khởi tạo
document.addEventListener("DOMContentLoaded", () => {
    loadData();
});

// Đổi trình độ (Tab hoặc Dropdown)
function changeLevel(level) {
    currentSheet = level;
    
    // Đồng bộ UI giữa Tabs và Dropdown
    document.querySelectorAll('.custom-tabs .nav-link').forEach(el => el.classList.remove('active'));
    let tabIndex = level === 'tiengDucA1' ? 0 : 1;
    if(document.querySelectorAll('.custom-tabs .nav-link')[tabIndex]) {
        document.querySelectorAll('.custom-tabs .nav-link')[tabIndex].classList.add('active');
    }
    if(document.getElementById('filterLevel')) {
        document.getElementById('filterLevel').value = level;
    }

    loadData();
}

// 1. TẢI DỮ LIỆU TỪ GOOGLE SHEET
function loadData() {
    if(document.getElementById('loading')) document.getElementById('loading').style.display = 'block';
    if(document.getElementById('tableBody')) document.getElementById('tableBody').innerHTML = '';

    fetch(`${URL_WEB_APP}?sheet=${currentSheet}`)
    .then(response => response.json())
    .then(res => {
        allData = res;
        if(typeof populateTopics === "function") populateTopics();
        if(typeof displayData === "function") displayData(); // Hàm hiển thị bảng của bạn nếu có
        if(document.getElementById('loading')) document.getElementById('loading').style.display = 'none';
    })
    .catch(error => {
        console.error("Lỗi tải dữ liệu:", error);
        alert("Không thể tải dữ liệu từ Google Sheets. Hãy kiểm tra lại link Web App hoặc quyền truy cập Anyone.");
    });
}

// 2. HÀM GỬI YÊU CẦU (THÊM, SỬA, XÓA) LÊN GOOGLE SHEET
function sendDataToGoogleSheet(action, rowIndex, dataObj, successMessage) {
    if(document.getElementById('loading')) document.getElementById('loading').style.display = 'block';
    
    const payload = {
        action: action,
        sheetName: currentSheet,
        rowIndex: rowIndex,
        data: dataObj
    };

    fetch(URL_WEB_APP, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(result => {
        if(document.getElementById('loading')) document.getElementById('loading').style.display = 'none';
        if (result.status === "success") {
            alert(successMessage || result.message);
            
            // Đóng các modal thông báo/nhập liệu nếu có
            if(typeof đóngModal === "function") đóngModal(); 
            
            // Tải lại dữ liệu mới nhất
            loadData();
        } else {
            alert("Lỗi từ hệ thống: " + result.message);
        }
    })
    .catch(error => {
        if(document.getElementById('loading')) document.getElementById('loading').style.display = 'none';
        console.error("Lỗi kết nối:", error);
        alert("Lỗi kết nối server mạng hoặc lỗi CORS!");
    });
}

// 3. THAY THẾ CÁC HÀM XỬ LÝ SỰ KIỆN CŨ CỦA BẠN:

// Thay cho hàm thêm mới cũ
function bieuMauThemMoi(obj) {
    sendDataToGoogleSheet("add", null, obj, "Đã thêm từ mới vào Google Sheet thành công!");
}

// Thay cho hàm sửa cũ
function bieuMauCapNhat(rowIndex, obj) {
    sendDataToGoogleSheet("update", rowIndex, obj, "Đã cập nhật dữ liệu thành công!");
}

// Thay cho hàm xóa cũ
function bieuMauXoa(rowIndex) {
    sendDataToGoogleSheet("delete", rowIndex, null, "Đã xóa dòng dữ liệu thành công!");
}
</script>
